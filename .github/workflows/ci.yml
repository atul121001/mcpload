name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (vet, test, xk6 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xk6-mcpload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Follows the `go` directive in go.mod (1.26 or later, per docs/ARCHITECTURE.md D2).
          go-version-file: xk6-mcpload/go.mod
          cache-dependency-path: xk6-mcpload/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Install xk6
        run: go install go.k6.io/xk6@v1.4.14
      - name: Build k6 with xk6-mcpload
        run: |
          xk6 build --with "github.com/atul121001/mcpload/xk6-mcpload=." --output ./k6
          ./k6 version
      - uses: actions/upload-artifact@v4
        with:
          name: k6-mcpload-linux-amd64
          path: xk6-mcpload/k6
          retention-days: 7

  report:
    name: report (schema + examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/mcpload/go.mod
          cache-dependency-path: cmd/mcpload/go.*
      # generate.mjs writes the data; the Go analysis fills in the verdicts.
      - name: Examples are reproducible
        run: |
          node examples/generate.mjs
          (cd ../cmd/mcpload && go test ./internal/analysis -run TestExamples -update)
          git diff --exit-code -- examples/healthy.json examples/leaky.json examples/step-load.json
      - name: Validate examples against schema
        run: node validate.mjs examples/healthy.json examples/leaky.json examples/step-load.json
      - name: Render HTML reports
        run: |
          node render.mjs examples/healthy.json "$RUNNER_TEMP/healthy.html"
          node render.mjs examples/leaky.json "$RUNNER_TEMP/leaky.html"
          node render.mjs examples/step-load.json "$RUNNER_TEMP/step-load.html"
          grep -q 'id="report-data">{"schemaVersion":"1"' "$RUNNER_TEMP/leaky.html"

  scenarios:
    name: scenarios (syntax, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scenarios/package.json sets "type": "module", so node parses these as ES modules.
      # (--check only parses; the k6/x/mcpload import is not resolved.)
      - run: for f in scenarios/lib/*.js scenarios/*.js; do node --check "$f" || exit 1; echo "ok $f"; done
      - run: node scenarios/lib/schema-args.test.mjs
      - run: node scenarios/lib/workflow.test.mjs
      - run: node scenarios/lib/skew.test.mjs
      - run: node scenarios/lib/resilience.test.mjs
      - run: node scenarios/lib/cancel.test.mjs

  cli:
    name: cli (cmd/mcpload vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/mcpload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/mcpload/go.mod
          # go.* always matches go.mod, so caching works even before the module has a go.sum.
          cache-dependency-path: cmd/mcpload/go.*
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: |
          go build -trimpath -o ./mcpload .
          ./mcpload version
      - name: Validate example reports with the CLI
        run: |
          ./mcpload validate ../../report/examples/healthy.json
          ./mcpload validate ../../report/examples/leaky.json
          ./mcpload validate ../../report/examples/step-load.json
      # Release builds embed the engine and scenarios (-tags embedengine).
      # Use a stand-in engine script so the tagged build is compiled, vetted
      # and its extraction exercised without building k6 here.
      - name: Embedded-engine build (stand-in payload)
        run: |
          set -euo pipefail
          payload=internal/engine/bin
          mkdir -p "$payload"
          printf '#!/bin/sh\necho "k6 v0.0.0-fake (go1, linux/amd64)"\necho "Extensions:"\necho "  github.com/atul121001/mcpload/xk6-mcpload (devel), k6/x/mcpload [js]"\n' > "$payload/engine"
          cp -r ../../scenarios "$payload/scenarios"
          go vet -tags embedengine ./...
          go test -tags embedengine ./internal/engine
          go build -tags embedengine -trimpath -o "$RUNNER_TEMP/solo/mcpload" .
          cd "$RUNNER_TEMP"
          MCPLOAD_CACHE_DIR="$RUNNER_TEMP/cache" ./solo/mcpload version | tee version.txt
          grep -q 'engine: .*with xk6-mcpload (embedded)' version.txt
          grep -q 'scenarios: built in' version.txt
          # Second run reuses the extracted copy.
          MCPLOAD_CACHE_DIR="$RUNNER_TEMP/cache" ./solo/mcpload version >/dev/null
          test "$(find "$RUNNER_TEMP/cache/engine" -type f | wc -l | tr -d ' ')" -eq 1

  install:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install the latest release
        env:
          MCPLOAD_INSTALL_DIR: ${{ runner.temp }}/mcpload-home
          MCPLOAD_BIN_DIR: ${{ runner.temp }}/bin
        run: sh ./install.sh
      - name: Run mcpload from another folder
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          test -L "$RUNNER_TEMP/bin/mcpload"
          test -L "$RUNNER_TEMP/mcpload-home/current"
          PATH="$RUNNER_TEMP/bin:$PATH" mcpload version
      - name: Re-running upgrades in place
        env:
          MCPLOAD_INSTALL_DIR: ${{ runner.temp }}/mcpload-home
          MCPLOAD_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          sh ./install.sh
          test "$(find "$RUNNER_TEMP/mcpload-home" -mindepth 1 -maxdepth 1 -name 'v*' | wc -l | tr -d ' ')" -eq 1

  install-windows:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release (Windows PowerShell 5.1)
        shell: powershell
        env:
          MCPLOAD_INSTALL_DIR: ${{ runner.temp }}\mcpload
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location $env:RUNNER_TEMP
          mcpload version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -like "*$env:MCPLOAD_INSTALL_DIR\v*")) { Write-Error "install dir not on the user PATH: $userPath"; exit 1 }

  action:
    name: action (summary script + workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summary script renders the example reports
        run: |
          node action/summary.mjs report/examples/healthy.json --out "$RUNNER_TEMP/healthy.md" --github-output "$RUNNER_TEMP/healthy.out"
          node action/summary.mjs report/examples/leaky.json --out "$RUNNER_TEMP/leaky.md" --github-output "$RUNNER_TEMP/leaky.out"
          node action/summary.mjs "$RUNNER_TEMP/missing.json" --out "$RUNNER_TEMP/missing.md" --github-output "$RUNNER_TEMP/missing.out"
          grep -qx 'result=pass' "$RUNNER_TEMP/healthy.out"
          grep -qx 'result=fail' "$RUNNER_TEMP/leaky.out"
          grep -qx 'result=error' "$RUNNER_TEMP/missing.out"
          grep -q 'memory_leak' "$RUNNER_TEMP/leaky.md"
          cat "$RUNNER_TEMP/leaky.md" >> "$GITHUB_STEP_SUMMARY"
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  demo-servers:
    name: demo-servers (compose build + health + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-servers
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start and wait for /healthz
        run: |
          docker compose up -d
          for port in 3001 3002 3003 3004 3005 3006 3007; do
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 && { echo "port $port healthy"; break; }
              [ "$i" = 60 ] && { echo "::error::port $port not healthy"; docker compose logs --tail=100; exit 1; }
              sleep 2
            done
          done
      - name: Smoke test (asserts status codes and payloads per target)
        run: ./smoke.sh
      - name: Server logs
        if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  # The images release.yml publishes, built locally (no push): the mcpload
  # image runs, finds its bundled scenarios and writes reports to /work; and
  # `mcpload demo up` starts the embedded compose file from the demo images
  # (tagged locally under MCPLOAD_DEMO_IMAGE_PREFIX/MCPLOAD_DEMO_TAG) and
  # waits until every target answers /healthz.
  docker:
    name: docker (mcpload image + mcpload demo)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MCPLOAD_DEMO_IMAGE_PREFIX: mcpload-ci/demo
      MCPLOAD_DEMO_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/mcpload/go.mod
          cache-dependency-path: cmd/mcpload/go.*
      - name: Build the mcpload image
        run: docker build -t mcpload:ci --build-arg VERSION=v0.0.0-ci .
      - name: Image runs
        run: |
          docker run --rm mcpload:ci version | grep -qx 'mcpload v0.0.0-ci'
          docker run --rm mcpload:ci run --help
      - name: Build the demo images
        run: |
          docker compose -f demo-servers/docker-compose.yml build
          docker build -t "$MCPLOAD_DEMO_IMAGE_PREFIX-nginx:$MCPLOAD_DEMO_TAG" demo-servers/nginx
          docker tag mcpload-demo/ts-server:local "$MCPLOAD_DEMO_IMAGE_PREFIX-ts:$MCPLOAD_DEMO_TAG"
          docker tag mcpload-demo/py-server:local "$MCPLOAD_DEMO_IMAGE_PREFIX-py:$MCPLOAD_DEMO_TAG"
          docker tag mcpload-demo/go-server:local "$MCPLOAD_DEMO_IMAGE_PREFIX-go:$MCPLOAD_DEMO_TAG"
          docker tag mcpload-demo/mock-oauth:local "$MCPLOAD_DEMO_IMAGE_PREFIX-oauth:$MCPLOAD_DEMO_TAG"
      - name: mcpload demo up
        run: |
          (cd cmd/mcpload && go build -o ../../mcpload-cli .)
          ./mcpload-cli demo up --timeout 2m
          ./mcpload-cli demo status
      - name: Run the image against the demo (report lands in the mounted folder)
        run: |
          mkdir -p out
          # The demo ports are bound to 127.0.0.1, so share the host network.
          code=0
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD/out:/work" mcpload:ci \
            run --url http://localhost:3004/mcp --scenario lb-check --duration 10s --html report.html || code=$?
          # lb-stateful has no sticky sessions: the run must fail (exit 1) with session_not_found.
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1, got $code"; exit 1; }
          grep -q '"session_not_found"' out/report.json
          test -s out/report.html && test -O out/report.json
      - name: Demo logs
        if: failure()
        run: ./mcpload-cli demo logs --tail 100 || true
      - if: always()
        run: ./mcpload-cli demo down || true
