name: release

# Push a tag like v0.1.0 to build ready-to-run archives for Windows, macOS and
# Linux and publish them as a GitHub release, and push the container images
# (mcpload and the demo servers) to GHCR.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MCPLOAD_K6_VERSION: v2.3.0
      XK6_VERSION: v1.4.14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: xk6-mcpload/go.mod
          cache: false

      - name: Install xk6
        run: go install go.k6.io/xk6@"$XK6_VERSION"

      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="mcpload_${TAG#v}_${os}_${arch}"
            out="build/$name"
            mkdir -p "$out"
            echo "::group::$name"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              xk6 build "$MCPLOAD_K6_VERSION" \
                --with github.com/atul121001/mcpload/xk6-mcpload=./xk6-mcpload \
                --output "$out/k6$ext"
            (cd cmd/mcpload && GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "../../$out/mcpload$ext" .)
            cp -r scenarios "$out/"
            rm -f "$out/scenarios/package.json"
            cp LICENSE README.md "$out/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
            echo "::endgroup::"
          done
          (cd dist && sha256sum -- * > checksums.txt)
          ls -l dist

      - name: Smoke-test the Linux build
        run: |
          set -euo pipefail
          dir="build/mcpload_${GITHUB_REF_NAME#v}_linux_amd64"
          "$dir/mcpload" version
          "$dir/k6" version | grep -q 'k6/x/mcpload'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Ready-to-run downloads. Each archive contains \`mcpload\`, a \`k6\` build with MCP support, and the \`scenarios/\` folder. No Go toolchain needed.

          | Your computer | Download |
          |---|---|
          | Windows | \`mcpload_${TAG#v}_windows_amd64.zip\` |
          | Mac with Apple silicon (M1 or newer) | \`mcpload_${TAG#v}_darwin_arm64.tar.gz\` |
          | Mac with Intel | \`mcpload_${TAG#v}_darwin_amd64.tar.gz\` |
          | Linux | \`mcpload_${TAG#v}_linux_amd64.tar.gz\` (or \`linux_arm64\`) |

          Unpack it, open a terminal in the folder, and run \`./mcpload run --url <your MCP URL> --scenario scenarios/agent-session.js\`. See the README for the full walkthrough.

          On macOS, if you see "cannot be opened because the developer cannot be verified", run \`xattr -d com.apple.quarantine mcpload k6\` in the folder once.

          Verify downloads with \`checksums.txt\` (SHA-256).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/* --repo "$REPO" --title "mcpload $TAG" --notes-file notes.md

  # Container images on GHCR, tagged <version> (v stripped) and latest (not for
  # pre-releases such as v1.0.0-rc.1):
  #   ghcr.io/atul121001/mcpload               the CLI with its engine and scenarios (Dockerfile)
  #   ghcr.io/atul121001/mcpload-demo-<name>   the demo servers `mcpload demo up` runs; the CLI
  #                                            pulls the tag that matches its own version
  images:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcpload
            context: .
          - image: mcpload-demo-ts
            context: demo-servers/ts-server
          - image: mcpload-demo-py
            context: demo-servers/py-server
          - image: mcpload-demo-go
            context: demo-servers/go-server
          - image: mcpload-demo-oauth
            context: demo-servers/mock-oauth
          - image: mcpload-demo-nginx
            context: demo-servers/nginx
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/atul121001/${{ matrix.image }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tags="$IMAGE:$version"
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
