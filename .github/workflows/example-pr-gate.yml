# Example: gate pull requests on MCP load-test budgets with the mcpload Action.
#
# The job starts the demo MCP servers (demo-servers/docker-compose.yml) and runs the Action
# from this repository (`uses: ./action`). In your own repository, start your server the same
# way and pin the Action to a release tag or a full commit SHA, e.g.
# `uses: atul121001/mcpload/action@vX.Y.Z` or `@<40-char commit SHA>`, rather than a moving branch like @main.
#
# Two legs, one per protocol family, so a regression in either transport path is caught:
#  stateful  - ts-healthy (port 3001, TS SDK, sessions): protocol auto must resolve to 2025-11-25.
#              Calibration: lb-stateful (3004, two replicas, no sticky sessions) must be flagged
#              (session_not_found), so that step uses fail-on: never and asserts result == 'fail'.
#  stateless - stateless-2026 (3005, two go-sdk replicas behind round-robin nginx): protocol auto must
#              resolve to 2026-07-28. Calibration: lb-check on the same round-robin LB must PASS
#              (no sessions, so any replica can serve any request).
# Each leg runs agent-session for 1 minute; it must stay inside the budgets and must not be slower than
# main (baseline-branch: main). Pushes to main run the same jobs, and their report artifacts
# (mcpload-ts-healthy, mcpload-stateless-2026) are the baselines the next PRs compare with. Until main
# has one, the comparison is skipped with a notice.
name: example-pr-gate

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main] # produces the baseline reports for PRs
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # find and download main's report artifact (baseline-branch)
  pull-requests: write # PR comment

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-load-gate:
    name: mcp-load-gate (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: stateful
            services: ts-healthy lb-stateful
            ports: 3001 3004
            url: http://localhost:3001/mcp
            protocol: '2025-11-25'
            container: mcpload-demo-ts-healthy-1
            label: ts-healthy
            artifact: mcpload-ts-healthy # keep: main's existing baseline artifact
            lb-url: http://localhost:3004/mcp
            lb-label: lb-stateful
            lb-expect: fail
          - leg: stateless
            services: stateless-2026
            ports: 3005
            url: http://localhost:3005/mcp
            protocol: '2026-07-28'
            container: mcpload-demo-stateless-2026-a-1
            label: stateless-2026
            artifact: mcpload-stateless-2026
            lb-url: http://localhost:3005/mcp
            lb-label: stateless-2026-lb
            lb-expect: pass
    steps:
      - uses: actions/checkout@v4

      - name: Start demo MCP servers
        working-directory: demo-servers
        env:
          SERVICES: ${{ matrix.services }}
          PORTS: ${{ matrix.ports }}
        run: |
          # shellcheck disable=SC2086 # word-split the service and port lists
          docker compose up -d --build $SERVICES
          for port in $PORTS; do
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 && { echo "port $port up"; break; }
              [ "$i" = 60 ] && { echo "::error::port $port did not become healthy"; docker compose logs; exit 1; }
              sleep 2
            done
          done

      - name: Load gate (${{ matrix.label }})
        id: gate
        uses: ./action
        with:
          url: ${{ matrix.url }}
          scenario: agent-session
          vus: '10'
          duration: 1m
          p95-ms: '800'
          p99-ms: '2000'
          err-rate: '0.01'
          env: |
            TOOL_BUDGETS={"flaky":{"errRate":0.2}}
          sampler: docker
          container: ${{ matrix.container }}
          label: ${{ matrix.label }}
          artifact-name: ${{ matrix.artifact }}
          baseline-branch: main # per-tool Δ vs main's last successful run; a regression fails the gate
          comment-on-pr: 'true'
          upload-url: ${{ vars.MCPLOAD_URL }}
          api-key: ${{ secrets.MCPLOAD_KEY }}

      - name: Assert the negotiated protocol
        if: always() && steps.gate.outputs.report-path != ''
        env:
          REPORT: ${{ steps.gate.outputs.report-path }}
          WANT: ${{ matrix.protocol }}
        run: |
          [ -f "$REPORT" ] || { echo "no report (the gate step errored)"; exit 0; }
          got="$(jq -r '.run.protocol // empty' "$REPORT")"
          echo "protocol: got=$got want=$WANT"
          if [ "$got" != "$WANT" ]; then
            echo "::error::protocol auto resolved to '$got', expected '$WANT' (silent fallback?)"
            exit 1
          fi

      - name: Calibration (${{ matrix.lb-label }} must ${{ matrix.lb-expect }})
        id: lb
        uses: ./action
        with:
          url: ${{ matrix.lb-url }}
          scenario: lb-check
          duration: 30s
          label: ${{ matrix.lb-label }}
          artifact-name: mcpload-${{ matrix.lb-label }}
          fail-on: never

      - name: Assert the calibration result
        env:
          PASSED: ${{ steps.lb.outputs.passed }}
          RESULT: ${{ steps.lb.outputs.result }}
          WANT: ${{ matrix.lb-expect }}
          LABEL: ${{ matrix.lb-label }}
        run: |
          echo "$LABEL: result=$RESULT passed=$PASSED (want $WANT)"
          if [ "$RESULT" != "$WANT" ]; then
            echo "::error::expected $LABEL to $WANT, got result=$RESULT"
            exit 1
          fi

      - name: Server logs
        if: failure()
        working-directory: demo-servers
        run: docker compose logs --tail=200

      - name: Stop demo servers
        if: always()
        working-directory: demo-servers
        run: docker compose down -v
