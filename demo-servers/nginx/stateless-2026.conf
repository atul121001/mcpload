# Single worker so the round-robin counter is global: with the default
# worker_processes auto, each worker keeps its own counter and short-lived
# client connections all land on the first upstream, so requests would not
# actually alternate between the two replicas.
worker_processes 1;
events { worker_connections 4096; }

http {
    access_log off;
    error_log /dev/stderr warn;

    # stateless-2026: round-robin with no stickiness; a stateless server must be unaffected.
    upstream backends {
        server stateless-2026-a:3000;
        server stateless-2026-b:3000;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # streamable HTTP may answer with SSE: don't buffer, allow long streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            client_max_body_size 8m;
            # don't retry a failed/404 request on the other replica
            proxy_next_upstream off;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
