# Single worker so the round-robin counter is global: with the default
# worker_processes auto, each worker keeps its own counter and short-lived
# client connections all land on the first upstream, so requests would not
# actually alternate between the two replicas.
worker_processes 1;
events { worker_connections 4096; }

http {
    access_log off;
    error_log /dev/stderr warn;

    # skew: a rolling deploy caught halfway. Round-robin over two replicas on DIFFERENT builds:
    # skew-old (TS, stateful 2025-11-25 only) and skew-new (Go, 2026-07-28 stateless only, plus new_tool).
    # Each build rejects what it can't serve with a typed error (old: HTTP 400/404, new: -32022), fast.
    upstream backends {
        server skew-old:3000;
        server skew-new:3000;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # streamable HTTP may answer with SSE: don't buffer, allow long streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            client_max_body_size 8m;
            # don't retry a failed request on the other replica
            proxy_next_upstream off;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
