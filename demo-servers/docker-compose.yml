# Local-only, intentionally vulnerable test targets. Do not expose.
# (Ports are bound to 127.0.0.1 and nothing restarts automatically.)
# mcpload demo targets. Start: docker compose up -d --build   (from demo-servers/)
# Every MCP endpoint is http://localhost:<port>/mcp ; TS/Go/Py targets also expose /metrics and /healthz.
name: mcpload-demo

x-ts: &ts
  image: mcpload-demo/ts-server:local
  pull_policy: never   # built once by ts-healthy
  restart: "no"
  mem_limit: 256m
  environment: &ts-env
    PORT: "3000"
    FLAKY_RATE: "0.1"
    BIG_BYTES: "200000"

x-go: &go
  image: mcpload-demo/go-server:local
  pull_policy: never   # built once by stateless-2026-a
  restart: "no"
  mem_limit: 128m
  environment:
    PORT: "3000"

services:
  # 1. official TS SDK, stateful sessions, cleaned up properly -> expected: pass
  ts-healthy:
    <<: *ts
    build: ./ts-server
    ports: ["127.0.0.1:3001:3000"]

  # 2. same image, LEAK=1: ~1MB retained per session, sessions never removed -> expected: leak flagged
  #    (512m so a few hundred sessions fit before the OOM killer stops it)
  ts-leaky:
    <<: *ts
    mem_limit: 512m
    environment:
      <<: *ts-env
      LEAK: "1"
    ports: ["127.0.0.1:3002:3000"]

  # 3. official Python SDK (mcp 2.x MCPServer, formerly FastMCP), stateless_http, uvicorn -> expected: pass
  py-healthy:
    build: ./py-server
    image: mcpload-demo/py-server:local
    restart: "no"
    mem_limit: 256m
    environment:
      PORT: "3000"
    ports: ["127.0.0.1:3003:3000"]

  # 4. two ts-healthy replicas behind round-robin nginx, NO sticky sessions -> expected: session_not_found flagged
  lb-stateful-a:
    <<: *ts
    hostname: lb-stateful-a
  lb-stateful-b:
    <<: *ts
    hostname: lb-stateful-b
  lb-stateful:
    image: nginx:1.29-alpine
    restart: "no"
    mem_limit: 64m
    volumes: ["./nginx/lb-stateful.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [lb-stateful-a, lb-stateful-b]
    ports: ["127.0.0.1:3004:80"]

  # 5. go-sdk v1.8 stateless (2026-07-28 capable), two replicas, same round-robin LB -> expected: pass
  stateless-2026-a:
    <<: *go
    build: ./go-server
    hostname: stateless-2026-a
  stateless-2026-b:
    <<: *go
    hostname: stateless-2026-b
  stateless-2026:
    image: nginx:1.29-alpine
    restart: "no"
    mem_limit: 64m
    volumes: ["./nginx/stateless-2026.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [stateless-2026-a, stateless-2026-b]
    ports: ["127.0.0.1:3005:80"]

  # 6. OAuth: token server (30s tokens) + ts-healthy variant that introspects every request
  mock-oauth:
    build: ./mock-oauth
    image: mcpload-demo/mock-oauth:local
    restart: "no"
    mem_limit: 64m
    environment:
      PORT: "3000"
      TOKEN_TTL_SECONDS: "30"
      CLIENTS: "mcpload:secret"
    ports: ["127.0.0.1:3006:3000"]
  ts-oauth:
    <<: *ts
    environment:
      <<: *ts-env
      REQUIRE_AUTH_URL: "http://mock-oauth:3000/introspect"
    depends_on: [mock-oauth]
    ports: ["127.0.0.1:3007:3000"]

  # 7. same image, POOL_SIZE=2: every tool call holds one of 2 shared slots, so fast tools queue
  #    behind `slow` -> expected: tool_isolation fails (scenario isolation); ts-healthy passes it
  ts-pooled:
    <<: *ts
    environment:
      <<: *ts-env
      POOL_SIZE: "2"
    ports: ["127.0.0.1:3008:3000"]

  # 8. rolling deploy caught halfway (version skew): round-robin nginx over two replicas on DIFFERENT builds.
  #    skew-old = the TS server (stateful 2025-11-25 only); skew-new = the Go server with STATELESS_ONLY=1
  #    (2026-07-28 only, -32022 for anything older) and NEW_TOOL=1 (lists `new_tool`).
  #    Own image tags (:skew), so building these never rebuilds the images of the targets above.
  #    skew (3009): both builds reject what they can't serve with typed errors -> expected: version_skew warns
  #    skew-hang (3010): the old build never answers what it can't serve -> expected: version_skew fails
  skew-old:
    <<: *ts
    image: mcpload-demo/ts-server:skew
    build: ./ts-server
    hostname: skew-old
    environment:
      <<: *ts-env
      SERVER_NAME: "skew-old"
  skew-hang-old:
    <<: *ts
    image: mcpload-demo/ts-server:skew   # built by skew-old
    hostname: skew-hang-old
    environment:
      <<: *ts-env
      SERVER_NAME: "skew-hang-old"
      HANG_UNKNOWN: "1"
  skew-new:
    <<: *go
    image: mcpload-demo/go-server:skew
    build: ./go-server
    hostname: skew-new
    environment:
      PORT: "3000"
      SERVER_NAME: "skew-new"
      NEW_TOOL: "1"
      STATELESS_ONLY: "1"
  skew:
    image: nginx:1.29-alpine
    restart: "no"
    mem_limit: 64m
    volumes: ["./nginx/skew.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [skew-old, skew-new]
    ports: ["127.0.0.1:3009:80"]
  skew-hang:
    image: nginx:1.29-alpine
    restart: "no"
    mem_limit: 64m
    volumes: ["./nginx/skew-hang.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [skew-hang-old, skew-new]
    ports: ["127.0.0.1:3010:80"]
