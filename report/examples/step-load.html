  // ---------- regression over the constant-load window (same method as the CLI) ----------
  function linfit(t, y, from, to) {

    var n = xs.length; if (n < 3) return null;
    var mx = 0, my = 0; for (i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; } mx /= n; my /= n;
    var sxy = 0, sxx = 0; for (i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) * (xs[i] - mx); }

  // ---------- tiny SVG line chart (no dependencies; prints crisply) ----------

  function lineChart(id, o, again) {
    var host = document.getElementById(id); if (!host) return;
    if (!again) drawn.push([id, o]);
    var W = Math.max(320, Math.round((host.clientWidth || 1032) - 32)), H = o.height || 260, m = { l: 64, r: 16, t: 18, b: 30 };
    var t = S.t, xMax = Math.max(P.cooldownEndS, t[t.length - 1] || 0), xMin = 0;
    var all = []; o.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null) all.push(v); }); });
    var yLo = o.zero ? 0 : Math.min.apply(null, all), yHi = Math.max.apply(null, all);
    if (!all.length) { yLo = 0; yHi = 1; }
    var pad = (yHi - yLo) * 0.08 || Math.abs(yHi) * 0.1 || 1; if (!o.zero) yLo -= pad; yHi += pad;
    var u = o.unit || 1, ticks = niceTicks(yLo / u, yHi / u, W < 600 ? 3 : 4).map(function (v) { return v * u; }); yLo = Math.min(yLo, ticks[0]); yHi = Math.max(yHi, ticks[ticks.length - 1]);
    function X(v) { return m.l + (v - xMin) / (xMax - xMin || 1) * (W - m.l - m.r); }
    function Y(v) { return H - m.b - (v - yLo) / (yHi - yLo || 1) * (H - m.t - m.b); }
    var s = [];
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title) + '">');
    // phase shading
    if (P.warmupEndS > 0) s.push('<rect x="' + X(0) + '" y="' + m.t + '" width="' + (X(P.warmupEndS) - X(0)) + '" height="' + (H - m.t - m.b) + '" style="fill:var(--phase-warm)"/>');
    if (P.cooldownEndS > P.loadEndS) s.push('<rect x="' + X(P.loadEndS) + '" y="' + m.t + '" width="' + (X(P.cooldownEndS) - X(P.loadEndS)) + '" height="' + (H - m.t - m.b) + '" style="fill:var(--phase-cool)"/>');
    [['warm-up', 0, P.warmupEndS], ['constant load', P.warmupEndS, P.loadEndS], ['cool-down', P.loadEndS, P.cooldownEndS]].forEach(function (ph) {
      if (ph[2] - ph[1] <= 0 || X(ph[2]) - X(ph[1]) < ph[0].length * 6 + 12) return;
      s.push('<text class="phase-label" x="' + (X(ph[1]) + 6) + '" y="' + (m.t + 12) + '">' + ph[0] + '</text>');
    });
    // chaos restart (--chaos-restart): a vertical line at the restart, and one where the clients recovered
    var CH = R.chaos && R.chaos.ran && !R.chaos.error ? R.chaos : null;
    if (CH) {
      var rec = CH.recovery && CH.recovery.recoveryS != null ? CH.atS + CH.recovery.recoveryS : null;
      [['restart', CH.atS, 'var(--bad)'], ['recovered', rec, 'var(--good)']].forEach(function (mk) {
        if (mk[1] == null || mk[1] > xMax) return;
        s.push('<line x1="' + X(mk[1]) + '" x2="' + X(mk[1]) + '" y1="' + m.t + '" y2="' + (H - m.b) + '" style="stroke:' + mk[2] + '" stroke-width="1.5" stroke-dasharray="4 4"><title>' + esc(mk[0] + ' at ' + mmss(mk[1])) + '</title></line>');
      });
      s.push('<text class="phase-label" x="' + (X(CH.atS) + 4) + '" y="' + (m.t + 26) + '">restart</text>');
    }
    // grid + y axis
    s.push('<g class="axis">');
    ticks.forEach(function (v) {
      if (v < yLo - 1e-9 || v > yHi + 1e-9) return;
      s.push('<line class="gridline" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>');
      s.push('<text x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + esc(o.yFmt(v)) + '</text>');
    });
    var xStep = xMax > 3600 ? 600 : xMax > 1200 ? 300 : xMax > 300 ? 60 : 10;
    if (W < 600 && xMax > 1200) xStep *= 2;
    for (var xv = 0; xv <= xMax; xv += xStep) s.push('<text x="' + X(xv) + '" y="' + (H - m.b + 18) + '" text-anchor="middle">' + mmss(xv) + '</text>');
    s.push('<line class="baseline" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + (H - m.b) + '" y2="' + (H - m.b) + '"/></g>');
    // series
    o.series.forEach(function (sr) {
      var d = '', pen = false;
      sr.values.forEach(function (v, i) {
        var xx = sr.t ? sr.t[i] : t[i];
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + X(xx).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true;
      });
      s.push('<path d="' + d + '" fill="none" style="stroke:' + sr.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + (sr.dash ? ' stroke-dasharray="7 5"' : '') + '/>');
    });
    // hover layer
    s.push('<line class="xh" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" style="stroke:var(--muted)" stroke-width="1" visibility="hidden"/>');
    o.series.forEach(function (sr, k) { if (!sr.noHover) s.push('<circle class="dot' + k + '" r="4.5" style="fill:' + sr.color + ';stroke:var(--surface)" stroke-width="2" visibility="hidden"/>'); });
    s.push('<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + (W - m.l - m.r) + '" height="' + (H - m.t - m.b) + '" fill="transparent"/>');
    s.push('</svg>');
    var chaosLegend = CH ? '<span><i class="dash" style="border-top-color:var(--bad)"></i>restart ' + mmss(CH.atS) + '</span>' +
      (rec != null ? '<span><i class="dash" style="border-top-color:var(--good)"></i>recovered ' + mmss(rec) + '</span>' : '') : '';
    var legend = o.series.length > 1 ? '<div class="legend">' + o.series.map(function (sr) {
      return '<span><i class="' + (sr.dash ? 'dash' : '') + '" style="border-top-color:' + sr.color + '"></i>' + esc(sr.name) + '</span>';
    }).join('') + '<span><i class="box" style="background:var(--phase-warm)"></i>warm-up</span><span><i class="box" style="background:var(--phase-cool)"></i>cool-down</span>' + chaosLegend + '</div>'
      : chaosLegend ? '<div class="legend">' + chaosLegend + '</div>' : '';
    // data table (screen only; accessibility / exact values)
    var rows = t.map(function (tt, i) { return '<tr><td>' + mmss(tt) + '</td>' + o.series.filter(function (sr) { return !sr.noHover; }).map(function (sr) { return '<td>' + esc(sr.values[i] == null ? '–' : o.tipFmt(sr.values[i])) + '</td>'; }).join('') + '</tr>'; }).join('');
    var table = '<details><summary>Data table</summary><div class="tablewrap" style="max-height:260px;overflow:auto"><table class="small"><thead><tr><th>t</th>' +
      o.series.filter(function (sr) { return !sr.noHover; }).map(function (sr) { return '<th>' + esc(sr.name) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></details>';
    host.innerHTML = '<h3>' + esc(o.title) + '</h3>' + (o.subtitle ? '<div class="muted small">' + o.subtitle + '</div>' : '') + legend + s.join('') + table + '<div class="tip"></div>';

    var svg = host.querySelector('svg'), tip = host.querySelector('.tip'), xh = svg.querySelector('.xh');
    function hide() { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); o.series.forEach(function (sr, k) { var c = svg.querySelector('.dot' + k); if (c) c.setAttribute('visibility', 'hidden'); }); }
    function move(ev) {
      var r = svg.getBoundingClientRect(); if (!r.width) return;
      var px = (ev.clientX - r.left) / r.width * W;
      var tv = xMin + (px - m.l) / (W - m.l - m.r) * (xMax - xMin);
      var best = 0, bd = Infinity; for (var i = 0; i < t.length; i++) { var dd = Math.abs(t[i] - tv); if (dd < bd) { bd = dd; best = i; } }
      var x = X(t[best]); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
      var lines = ['<b>' + mmss(t[best]) + '</b> <span class="muted">' + phaseAt(t[best]) + '</span>'];
      o.series.forEach(function (sr, k) {
        if (sr.noHover) return;
        var c = svg.querySelector('.dot' + k), v = sr.values[best];
        if (v == null) { c.setAttribute('visibility', 'hidden'); lines.push(esc(sr.name) + ': –'); return; }
        c.setAttribute('cx', x); c.setAttribute('cy', Y(v)); c.setAttribute('visibility', 'visible');
        lines.push('<span style="color:' + sr.color + '">●</span> ' + esc(sr.name) + ': <b>' + esc(o.tipFmt(v)) + '</b>');
      });
      tip.innerHTML = lines.join('<br>'); tip.style.display = 'block';
      var hr = host.getBoundingClientRect(), left = ev.clientX - hr.left + 14;
      if (left + tip.offsetWidth > hr.width - 8) left = ev.clientX - hr.left - tip.offsetWidth - 14;
      tip.style.left = left + 'px'; tip.style.top = (r.top - hr.top + 24) + 'px';
    }
    var hit = svg.querySelector('.hit');
    hit.addEventListener('mousemove', move); hit.addEventListener('mouseleave', hide);
    hit.addEventListener('touchstart', function (e) { move(e.touches[0]); }, { passive: true });
    hit.addEventListener('touchmove', function (e) { move(e.touches[0]); }, { passive: true });
  }
  function phaseAt(x) { return x < P.warmupEndS ? 'warm-up' : x < P.loadEndS ? 'load' : 'cool-down'; }

  var C1 = 'var(--series-1)', C2 = 'var(--series-2)';

  if (hasRss) {
    var mv = verdicts.filter(function (v) { return v.id === 'memory_leak'; })[0];
    var fit = linfit(S.t, S.server.rssBytes, P.warmupEndS, P.loadEndS);
    var series = [{ name: 'RSS', values: S.server.rssBytes, color: C1 }];
    if (fit) series.push({ name: 'linear fit (load window)', values: [fit.at(P.warmupEndS), fit.at(P.loadEndS)], t: [P.warmupEndS, P.loadEndS], color: C2, dash: true, noHover: true });
    var subtitle = mv ? '<span class="badge ' + esc(mv.status) + '">' + (ICON[mv.status] || '') + ' ' + esc(mv.status) + '</span> ' +
      (mv.slopePerMin != null ? num(mv.slopePerMin / MB, 2) + ' MiB/min' : '') + (mv.r2 != null ? ' · R² ' + num(mv.r2, 2) : '') +
      (mv.baseline != null ? ' · baseline ' + mb(mv.baseline) : '') + (mv.cooldownRecovered != null ? (mv.cooldownRecovered ? ' · recovered in cool-down' : ' · no recovery in cool-down') : '')
      : (fit ? 'fit slope ' + num(fit.slope * 60 / MB, 2) + ' MiB/min' : '');
    lineChart('c-mem', { title: 'Resident memory (RSS)', subtitle: subtitle, series: series, yFmt: function (v) { return num(v / MB, 0) + ' MiB'; }, tipFmt: mb, unit: MB, height: 300 });
  }
  if (extra.indexOf('c-sess') >= 0) lineChart('c-sess', { title: 'Active sessions (server)', series: [{ name: 'sessions', values: S.server.activeSessions, color: C1 }], zero: true, yFmt: function (v) { return num(v, 1); }, tipFmt: function (v) { return num(v, 0); }, height: 200 });
  if (extra.indexOf('c-fds') >= 0) lineChart('c-fds', { title: 'Open file descriptors', series: [{ name: 'fds', values: S.server.openFds, color: C1 }], zero: true, yFmt: function (v) { return num(v, 0); }, tipFmt: function (v) { return num(v, 0); }, height: 200 });
  lineChart('c-p95', { title: 'Client p95 latency (all requests)', series: [{ name: 'p95', values: S.client.p95Ms, color: C1 }], zero: true, yFmt: ms, tipFmt: ms, height: 220 });
  lineChart('c-err', { title: 'Client error rate', series: [{ name: 'error rate', values: S.client.errorRate, color: C1 }], zero: true, yFmt: function (v) { return pct(v, 2); }, tipFmt: function (v) { return pct(v, 3); }, height: 220 });
  if (toolSeries.length) {
    // Fixed categorical order by request count (the per-tool table order); color follows the tool.
    var reqsOf = {}; (R.tools || []).forEach(function (t) { reqsOf[t.name] = t.reqs; });
    toolSeries.sort(function (a, b) { return (reqsOf[b] || 0) - (reqsOf[a] || 0) || (a < b ? -1 : 1); });
    var shown = toolSeries.slice(0, 8);
    var ld = verdicts.filter(function (v) { return v.id === 'latency_drift'; })[0];
    var sub = (ld && ld.status === 'warn' ? '<span class="badge warn">' + ICON.warn + ' drift</span> ' + esc(ld.message) : 'p95 of successful calls per bucket') +
      (toolSeries.length > shown.length ? ' · showing the ' + shown.length + ' busiest of ' + toolSeries.length + ' tools' : '');
    lineChart('c-tools', { title: 'Per-tool p95 latency', subtitle: sub, series: shown.map(function (n, i) { return { name: n, values: S.tools[n].p95Ms, color: 'var(--series-' + (i + 1) + ')' }; }),
      zero: true, yFmt: ms, tipFmt: ms, height: 260 });
  }
  // ---------- p95 vs agents (step-load): steps evenly spaced on x, labelled with their agent count ----------
  function stepChart(id, o, again) {
    var host = document.getElementById(id); if (!host) return;
    if (!again) drawn.push([id, o, stepChart]);
    var W = Math.max(320, Math.round((host.clientWidth || 1032) - 32)), H = 260, m = { l: 64, r: 16, t: 18, b: 34 };
    var steps = o.steps, n = steps.length;
    var all = []; o.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null) all.push(v); }); });
    if (o.budget != null) all.push(o.budget);
    var yHi = all.length ? Math.max.apply(null, all) * 1.08 : 1;
    var ticks = niceTicks(0, yHi, W < 600 ? 3 : 4); yHi = Math.max(yHi, ticks[ticks.length - 1]);
    function X(i) { return n === 1 ? (m.l + W - m.r) / 2 : m.l + 12 + i / (n - 1) * (W - m.l - m.r - 24); }
    function Y(v) { return H - m.b - v / (yHi || 1) * (H - m.t - m.b); }
    var s = ['<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title) + '"><g class="axis">'];
    ticks.forEach(function (v) {
      s.push('<line class="gridline" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>');
      s.push('<text x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + esc(ms(v)) + '</text>');
    });
    steps.forEach(function (st, i) { s.push('<text x="' + X(i) + '" y="' + (H - m.b + 18) + '" text-anchor="middle">' + num(st.vus) + '</text>'); });
    s.push('<text x="' + (W - m.r) + '" y="' + (H - 2) + '" text-anchor="end">agents</text>');
    s.push('<line class="baseline" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + (H - m.b) + '" y2="' + (H - m.b) + '"/></g>');
    if (o.breakAt >= 0) {
      s.push('<line x1="' + X(o.breakAt) + '" x2="' + X(o.breakAt) + '" y1="' + m.t + '" y2="' + (H - m.b) + '" style="stroke:var(--bad)" stroke-width="1.5" stroke-dasharray="4 4"/>');
      s.push('<text class="phase-label" x="' + (X(o.breakAt) - 6) + '" y="' + (m.t + 12) + '" text-anchor="end">' + (o.inconclusive ? 'inconclusive' : 'breaking point') + '</text>');
    }
    if (o.budget != null) s.push('<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(o.budget) + '" y2="' + Y(o.budget) + '" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="7 5"/>');
    o.series.forEach(function (sr) {
      var d = '', pen = false;
      sr.values.forEach(function (v, i) { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
      s.push('<path d="' + d + '" fill="none" style="stroke:' + sr.color + '" stroke-width="2" stroke-linejoin="round"/>');
      sr.values.forEach(function (v, i) {
        if (v == null) return;
        s.push('<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3.5" style="fill:' + sr.color + ';stroke:var(--surface)" stroke-width="1.5"><title>' + esc(sr.name + ' at ' + steps[i].vus + ' agents: p95 ' + ms(v)) + '</title></circle>');
      });
    });
    s.push('</svg>');
    var legend = '<div class="legend">' + o.series.map(function (sr) { return '<span><i style="border-top-color:' + sr.color + '"></i>' + esc(sr.name) + '</span>'; }).join('') +
      (o.budget != null ? '<span><i class="dash" style="border-top-color:var(--muted)"></i>p95 budget</span>' : '') + '</div>';
    host.innerHTML = '<h3>' + esc(o.title) + '</h3><div class="muted small">' + o.subtitle + '</div>' + legend + s.join('');
  }
  if (cap) {
    var shownCap = capTools.slice(0, 8), budgets = (cap.budgets && cap.budgets.tools) || {};
    var b95 = shownCap.map(function (n) { return budgets[n] ? budgets[n].p95Ms : null; });
    var sameBudget = b95.length && b95.every(function (b) { return b != null && b === b95[0]; });
    var breakAt = -1; cap.steps.forEach(function (st, i) { if (breakAt < 0 && st.vus === cap.breakingVus) breakAt = i; });
    stepChart('c-steps', {
      title: 'Per-tool p95 latency by concurrency', steps: cap.steps, breakAt: breakAt, inconclusive: cap.inconclusive, budget: sameBudget ? b95[0] : null,
      subtitle: 'p95 of successful calls within each step' + (capTools.length > shownCap.length ? ' · showing the ' + shownCap.length + ' busiest of ' + capTools.length + ' tools' : ''),
      series: shownCap.map(function (n, i) {
        return { name: n, color: 'var(--series-' + (i + 1) + ')', values: cap.steps.map(function (st) { var t = st.tools.filter(function (x) { return x.name === n; })[0]; return t ? t.p95 : null; }) };
      }),
    });
  }
  var lastW = window.innerWidth, rt;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return; lastW = window.innerWidth;
    clearTimeout(rt); rt = setTimeout(function () { drawn.forEach(function (d) { (d[2] || lineChart)(d[0], d[1], true); }); }, 150);
  });
  lineChart('c-rps', { title: 'Throughput (requests/s)', series: [{ name: 'req/s', values: S.client.rps, color: C1 }], zero: true, yFmt: function (v) { return num(v, 0); }, tipFmt: function (v) { return num(v, 1) + ' req/s'; }, height: 180 });
})();
</script>
